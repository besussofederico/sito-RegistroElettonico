<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registro Elettronico</title>
</head>

<body class="bg-light">

    <div class="bg-danger py-2 text-white text-center mb-4">
        <h1>REGISTRO</h1>
    </div>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="card border-0 shadow-sm p-4 mb-4">
                    <h5 class="fw-bold mb-3">Inserisci Nuovo Voto</h5>
                    <div class="mb-3">
                        <label for="inputMateria" class="form-label">Materia</label>
                        <input type="text" id="inputMateria" class="form-control" placeholder="Es. Informatica">
                    </div>
                    <div class="mb-3">
                        <label for="inputVoto" class="form-label">Voto (1 - 10)</label>
                        <input type="number" id="inputVoto" class="form-control" min="1" max="10" step="0.5" placeholder="Es. 8">
                    </div>
                    <button id="btnAggiungi" class="btn btn-danger w-100 fw-bold">Aggiungi Voto</button>
                </div>

                <div class="card border-0 shadow-sm p-4 text-center">
                    <h5 class="text-muted fw-bold mb-2">Media Voti</h5>
                    <h2 id="mediaVoti" class="display-3 fw-bold text-success m-0">--</h2>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold text-center text-dark">Ultimi Voti</h5>
                    </div>
                    <ul id="listaVoti" class="list-group list-group-flush">
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
